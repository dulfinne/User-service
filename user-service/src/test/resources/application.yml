spring:
  application:
    name: user-service

  data:
    mongodb:
      uri: ${MONGO_URL:mongodb://localhost:27017}
      auto-index-creation: true
      database: test_user_db
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:29092
    consumers-number: 3
    groups:
      game-payments: game-payments-group
    topics:
      game-payments: game-payments-topic
    error-handler:
      min-interval: 0
      max-interval: 0
      multiplier: 1.0
      max-attempts: 0
    dlt-postfix: .DLT

  cloud:
    stream:
      output-bindings: transaction-topic
      binders:
        kafka:
          environment:
            spring:
              kafka:
                bootstrap-servers: localhost:29092
      default-binder: kafka

grpc:
  client:
    transactionService:
      address: static://localhost:9090
      negotiationType: plaintext
