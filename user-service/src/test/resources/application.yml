spring:
  application:
    name: user-service

  data:
    mongodb:
      uri: ${MONGO_URL:mongodb://localhost:27017}
      auto-index-creation: true
      database: test_user_db

  kafka:
    bootstrap-servers: localhost:29092
    consumers-number: 3
    groups:
      game-payments: game-payments-group
    topics:
      game-payments: game-payments-topic
    error-handler:
      min-interval: 100
      max-interval: 100
      multiplier: 2.0
      max-attempts: 1
    dlt-postfix: .DLT
