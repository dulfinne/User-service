syntax = "proto3";

option java_package = "com.dulfinne.randomgame.userservice.grpc";
option java_outer_classname = "TransactionProto";

service TransactionService {
  rpc SaveTransaction (Transaction) returns (SavedReply) {}
}

message Transaction {
  string username = 1;
  string amount = 2;
  string type = 3;
}

message SavedReply {
  bool isSaved = 1;
}